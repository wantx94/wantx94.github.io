<!doctype html>
<html lang="zh-Hant">

<meta charset="utf-8">

<title>咕咕養雞場 Chicken Farm</title>
<style>
  :root {
    --page: #fbf3e4;
    --paper: #fff8ea;
    --text: #4a3426;
    --dim: #7d6553;
    --line: #5c4433;
    --wood: #c99a66;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
    line-height: 1.7;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main { max-width: 480px; width: 100%; padding: 40px 16px; text-align: center; }
  .icon { display: block; margin: 0 auto; width: 128px; height: 128px; border-radius: 29px; border: 3px solid var(--line); overflow: hidden; }
  h1 { font-size: 34px; margin: 18px 0 0; font-weight: 900; }
  .en { color: var(--dim); margin: 0 0 18px; font-weight: 700; }
  p { margin: 8px 0; }
  .links { display: flex; flex-direction: column; gap: 10px; margin: 26px 0; }
  .links a {
    display: block; padding: 12px 16px; border: 2.5px solid var(--line); border-radius: 14px;
    background: var(--wood); color: #fff8ea; text-decoration: none; font-weight: 800;
    text-shadow: 0 1px 0 var(--line);
  }
  .contact { color: var(--dim); font-size: 14px; }
  .contact a { color: #8a4f22; }
</style>
</head>
